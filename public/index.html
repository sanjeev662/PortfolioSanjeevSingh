    <!-- Applies the persisted theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var THEMES = ["light", "dark", "midnight", "obsidian", "dawn", "arctic"];
          var LIGHT_THEMES = ["light", "dawn", "arctic"];
          var stored = null;
          try {
            stored = window.localStorage.getItem("portfolio-theme");
          } catch (e) {}
          var theme = THEMES.indexOf(stored) > -1 ? stored : null;
          if (!theme) {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          var root = document.documentElement;
          root.classList.remove.apply(root.classList, THEMES);
          root.classList.add(theme);
          root.style.colorScheme =
            LIGHT_THEMES.indexOf(theme) > -1 ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
